<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>料金所ボイスロガー（実験版）</title>
<style>
  :root{
    --ink:#1c2230;
    --paper:#f4f2ec;
    --line:#2c3444;
    --accent:#2f6f5e;   /* 深い緑 - 高速道路の案内標識をイメージ */
    --accent-dim:#e4ede9;
    --warn:#b5482f;
    --warn-dim:#f6e4de;
    --muted:#6b7280;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{padding:0 16px 40px;max-width:520px;margin:0 auto;}

  header{padding:20px 0 12px;border-bottom:2px solid var(--line);margin-bottom:16px;}
  header .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700;}
  header h1{font-size:20px;margin:4px 0 6px;letter-spacing:.02em;}
  header p{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0;}

  .support-warning{background:var(--warn-dim);border:1px solid var(--warn);color:var(--warn);
    padding:10px 12px;border-radius:6px;font-size:12.5px;line-height:1.6;margin-bottom:16px;display:none;}

  .mode-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .mode-btn{flex:1;padding:12px 0;text-align:center;border:2px solid var(--line);border-radius:8px;
    background:var(--card);font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;}
  .mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;
    text-align:center;margin-bottom:16px;}
  .status-label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:10px;}
  .status-text{font-size:16px;min-height:24px;margin-bottom:16px;line-height:1.5;}
  .status-text .heard{color:var(--accent);font-weight:700;}

  .mic-btn{width:104px;height:104px;border-radius:50%;border:none;background:var(--accent);
    color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin:0 auto 6px;

  .mic-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5346;}

  .mic-hint{font-size:11.5px;color:var(--muted);}

  .confirm-row .ok{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ============ ファジーマッチング ============ */
function normalize(s){
  return s
    .replace(/\s+/g,"")
    .replace(/インターチェンジ/g,"IC")
    .replace(/インター/g,"IC")
    .replace(/ジャンクション/g,"JCT")
    .replace(/料金所/g,"")
    .replace(/IC$/,"")
    .replace(/JCT$/,"")
    .replace(/[ケヶが]/g,"ケ")
    .toLowerCase();
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}

function similarity(a,b){
  const na=normalize(a), nb=normalize(b);
  if(na.length===0 || nb.length===0) return 0;
  if(na===nb) return 1;
  let bonus = 0;
  if(na.includes(nb) || nb.includes(na)) bonus = 0.15;
  const dist = levenshtein(na,nb);
  const maxLen = Math.max(na.length, nb.length);
  const base = 1 - dist/maxLen;
  return Math.min(1, base + bonus);
}

function findCandidates(heard){
  return TOLLGATE_MASTER
    .map(t => ({ ...t, score: similarity(heard, t.name.replace(/IC$|JCT$/,"")) }))
    .sort((a,b)=>b.score-a.score)
    .slice(0,4);
}

/* 実機テストで見つかった「読みは合っているが違う漢字」などの誤変換を、
   ここに追記していくことで精度を積み上げていく。
   キー: 音声認識が実際に返した文字列 → 値: 正しいIC名（TOLLGATE_MASTER内のnameと一致させる） */
const MISRECOGNITION_ALIASES = {
  "清和滝": "勢和多気IC",
  "せいわたき": "勢和多気IC",
};

function applyAliases(text){
  const normalized = text.replace(/\s+/g,"");
  return MISRECOGNITION_ALIASES[normalized] || null;
}

/* 音声認識の複数候補（alternatives）すべてに対してマッチングを行い、
   最もスコアの高い組み合わせを採用する */
function findBestAcrossAlternatives(alternativeTexts){
  // まずエイリアス辞書に完全一致するものがあれば最優先
  for(const text of alternativeTexts){
    const aliasHit = applyAliases(text);
    if(aliasHit){
      const master = TOLLGATE_MASTER.find(t=>t.name===aliasHit);
      if(master) return { heardText: text, candidates: [{...master, score:1.0}], viaAlias:true };
    }
  }
  // なければ全alternativeに対して通常のファジーマッチングを行い、
  // トップ候補のスコアが一番高かったものを採用
  let best = null;
  for(const text of alternativeTexts){
    const candidates = findCandidates(text);
    if(candidates[0] && (!best || candidates[0].score > best.candidates[0].score)){
      best = { heardText: text, candidates, viaAlias:false };
    }
  }
  return best;
}

function setMode(m){
  mode = m;
  el.modeIn.classList.toggle("active", m==="in");
  el.modeOut.classList.toggle("active", m==="out");
}

function speak(text){
  return new Promise(resolve=>{
    if(!window.speechSynthesis){ resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = 1.02;
    u.onend = ()=>resolve();
    u.onerror = ()=>resolve();
    window.speechSynthesis.speak(u);
  });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){
  el.supportWarning.style.display = "block";
  el.micBtn.disabled = true;
} 

function startRecognition(onResult, onFail){
  if(!SR) return;
  recognition = new SR();
  recognition.lang = "ja-JP";
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;
  recognizing = true;
  el.micBtn.classList.add("listening");

  recognition.onresult = (e)=>{
    const alternatives = [];
    for(let i=0;i<e.results[0].length;i++){
      alternatives.push(e.results[0][i].transcript);
    }
    onResult(alternatives);
  };
  recognition.onerror = (e)=>{
    recognizing = false;
    el.micBtn.classList.remove("listening");
    onFail && onFail(e.error);
  };
  recognition.onend = ()=>{
    recognizing = false;
    el.micBtn.classList.remove("listening");
  };
  recognition.start();
}

el.micBtn.addEventListener("click", ()=>{
  if(recognizing) return;
  if(phase === "idle" || phase === "confirming"){
    beginListenName();
  }
});

function beginListenName(){
  phase = "listening_name";
  el.confirmRow.hidden = true;
  el.statusText.textContent = "聞いています…料金所名を読み上げてください";
  el.micBtnLabel.innerHTML = "聞き取り中";
  el.micHint.textContent = "はっきり発音してください";

  startRecognition(
    (alternatives)=>{
      const result = findBestAcrossAlternatives(alternatives);
      const text = result ? result.heardText : alternatives[0];
      el.dbgRaw.textContent = alternatives.join(" / ");
      const candidates = result ? result.candidates : [];
      currentTop = candidates[0];
      renderDebug(candidates);

      if(!currentTop || currentTop.score < 0.35){
        el.statusText.innerHTML = `聞き取れましたが、候補が見つかりませんでした：<span class="heard">「${text}」</span><br>もう一度お試しください`;
        resetMicButton();
        phase = "idle";
        return;
      }
      askConfirm(currentTop, text);
    },
    (err)=>{
      el.statusText.textContent = `認識エラー（${err}）。もう一度タップしてください`;
      resetMicButton();
      phase = "idle";
    }
  );
}

async function askConfirm(top, heardText){
  phase = "confirming";
  el.statusText.innerHTML = `<span class="heard">「${top.name}」</span>でよろしいですか？`;
  resetMicButton();
  el.confirmRow.hidden = false;
  await speak(`${top.name.replace(/IC$|JCT$/,"")}でよろしいですか？`);
}

el.btnOk.addEventListener("click", ()=>confirmYes());
el.btnNg.addEventListener("click", ()=>confirmNo());

function confirmYes(){
  if(!currentTop) return;
  addLogEntry(currentTop.name, mode);
  el.confirmRow.hidden = true;
  el.statusText.innerHTML = `記録しました：<span class="heard">${currentTop.name}</span>`;
  phase = "idle";
  speak("記録しました");
  currentTop = null;
}

function confirmNo(){
  el.confirmRow.hidden = true;
  el.statusText.textContent = "もう一度、マイクをタップして読み上げてください";
  phase = "idle";
  currentTop = null;
}

function resetMicButton(){
  el.micBtnLabel.innerHTML = "タップして<br>読み上げ";
  el.micHint.textContent = "1回タップで開始、自動的に聞き取ります";
}

function renderDebug(candidates){
  el.dbgTop.textContent = candidates[0] ? `${candidates[0].name}（score: ${candidates[0].score.toFixed(2)}）` : "-";
  el.dbgCandidates.innerHTML = candidates.map(c=>
    `<div class="cand"><span>${c.name} (${c.pref}/${c.route})</span><span>${c.score.toFixed(2)}</span></div>`
  ).join("");
}

function addLogEntry(name, m){
  const now = new Date();
  const timeStr = now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  sessionLog.unshift({name, mode:m, time:timeStr});
  renderLog();
}

function renderLog(){
  el.logCount.textContent = `${sessionLog.length}件`;
  if(sessionLog.length===0){
    el.logList.innerHTML = `<div class="empty">まだ記録がありません</div>`;
    return;
  }
  el.logList.innerHTML = sessionLog.map(item=>`
    <div class="log-item">
      <div><span class="tag ${item.mode==='in'?'in':'out'}">${item.mode==='in'?'入口':'出口'}</span><span class="name">${item.name}</span></div>
      <div class="time">${item.time}</div>
    </div>
  `).join("");
}
</script>
</body>
</html>
